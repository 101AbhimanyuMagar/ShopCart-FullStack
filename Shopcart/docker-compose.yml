services:

  mysql:
    image: mysql:8.0
    container_name: shopcart-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopcart_db

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - shopcart-net


  backend:
    image: abhimannyu100/shopcart-backend
    container_name: shopcart-backend
    restart: always

    env_file:
      - ./shopcart_backend/.env

    ports:
      - "8080:8080"

    volumes:
      - ./shopcart_uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - shopcart-net


  frontend:
    image: abhimannyu100/shopcart-frontend
    container_name: shopcart-frontend
    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - shopcart-net


networks:
  shopcart-net: